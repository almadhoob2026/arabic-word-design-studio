name: Validate Arabic Word Design Studio
on:
  push:
  pull_request:
jobs:
  structural-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
      - name: Generate and audit all sample documents
        run: |
          mkdir -p output
          for type in executive_report official_decision strategic_plan impact_report; do
            python scripts/build.py "examples/briefs/$type.json" --out "output/$type.docx"
            python scripts/audit_docx.py "output/$type.docx" --type "$type"
          done
      # Visual verification requires a separate reviewer and a compatible renderer.
